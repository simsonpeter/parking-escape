<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Slide cars, clear a path, escape the lot." />
    <title>Parking Escape</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <button id="sound-toggle" class="icon-btn sound-fab" type="button" aria-label="Toggle sound">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm2.5 0a7 7 0 0 0-4-6.3v2.2a5 5 0 0 1 0 8.2v2.2A7 7 0 0 0 18 12z" />
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16.5 12a4.5 4.5 0 0 0-1.3-3.2l-1.4 1.4A2.7 2.7 0 0 1 14.5 12c0 .5-.1 1-.4 1.4l1.5 1.5A4.5 4.5 0 0 0 16.5 12zM4 9v6h4l5 4V5L8 9H4zm15.1-5.1-1.4 1.4 1.8 1.8-1.4 1.4 1.4 1.4 1.8-1.8 1.8 1.8 1.4-1.4-1.8-1.8 1.8-1.8-1.4-1.4-1.8 1.8-1.8-1.8z" />
        </svg>
      </button>

      <section id="screen-start" class="screen active" data-screen="start">
        <div class="start-bg" aria-hidden="true"></div>
        <div class="start-content">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-car"></span>
          </div>
          <p class="eyebrow">Premium puzzle</p>
          <h1>PARKING<br />ESCAPE</h1>
          <p class="tagline">Can you clear the way?</p>
          <div class="start-actions">
            <button id="btn-play" class="btn btn-primary" type="button">Play</button>
            <button id="btn-levels" class="btn btn-ghost" type="button">Levels</button>
          </div>
        </div>
      </section>

      <section id="screen-levels" class="screen" data-screen="levels">
        <header class="screen-head">
          <button id="btn-levels-back" class="icon-btn" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15.5 5.5 9 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div>
            <p class="eyebrow">Select</p>
            <h2>Levels</h2>
          </div>
          <span class="head-spacer"></span>
        </header>
        <div id="level-grid" class="level-grid"></div>
      </section>

      <section id="screen-game" class="screen" data-screen="game">
        <header class="game-hud">
          <button id="btn-game-back" class="icon-btn" type="button" aria-label="Back to levels">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15.5 5.5 9 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="hud-title">
            <p class="eyebrow">Parking Escape</p>
            <h2 id="hud-level">Level 1</h2>
          </div>
          <div class="hud-stats">
            <div class="stat">
              <span class="stat-label">Moves</span>
              <strong id="hud-moves">0</strong>
            </div>
            <div id="hud-stars" class="stars" aria-label="Star rating">
              <span class="star" data-star="1"></span>
              <span class="star" data-star="2"></span>
              <span class="star" data-star="3"></span>
            </div>
          </div>
        </header>

        <div class="board-stage">
          <div id="lot-frame" class="lot-frame">
            <div class="lot-wall lot-wall-top"></div>
            <div class="lot-wall lot-wall-left"></div>
            <div class="lot-wall lot-wall-bottom"></div>
            <div id="board" class="board"></div>
            <div id="exit-bay" class="exit-bay">
              <div class="exit-arrows"></div>
              <span class="exit-label">EXIT</span>
            </div>
          </div>
          <p id="coach" class="coach hidden">Drag the red car to the exit</p>
        </div>

        <div class="game-dock">
          <button id="btn-reset" class="btn btn-dock" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 12a7.5 7.5 0 1 1 2.2 5.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M4 8.5v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Reset
          </button>
          <button id="btn-undo" class="btn btn-dock" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 8H4v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M4.6 12A8 8 0 1 0 6 7.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            Undo
          </button>
          <button id="btn-hint" class="btn btn-dock" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 18h6M10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <path d="M12 3a6 6 0 0 0-3.6 10.8c.9.7 1.6 1.7 1.6 2.7h4c0-1 .7-2 1.6-2.7A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            </svg>
            Hint
          </button>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <div id="modal-complete" class="modal" aria-hidden="true">
      <div class="modal-card">
        <p class="eyebrow">Well parked</p>
        <h2>LEVEL COMPLETE!</h2>
        <div id="modal-stars" class="stars stars-lg">
          <span class="star" data-star="1"></span>
          <span class="star" data-star="2"></span>
          <span class="star" data-star="3"></span>
        </div>
        <p id="modal-moves" class="modal-moves">12 moves</p>
        <div class="modal-actions">
          <button id="btn-next" class="btn btn-primary" type="button">Next Level</button>
          <div class="modal-row">
            <button id="btn-replay" class="btn btn-ghost" type="button">Replay</button>
            <button id="btn-to-levels" class="btn btn-ghost" type="button">Levels</button>
          </div>
        </div>
      </div>
    </div>

    <script src="levels.js"></script>
    <script src="game.js"></script>
  </body>
</html>
